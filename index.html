<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIS Portal</title>


<!-- CSS -->

<link rel="stylesheet" href="lib/leaflet/leaflet.css">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/toolbar.css">

<link rel="stylesheet" href="css/layerpanel.css">

<link rel="stylesheet" href="css/legend.css">

<link rel="stylesheet" href="css/responsive.css">


</head>


<body>


<!-- ========================= -->
<!-- Toolbar -->
<!-- ========================= -->


<header id="toolbar">


<div class="toolbar-container">


<div class="toolbar-left">


<button class="tool-button">
Home
</button>

</div>

<div class="toolbar-center">

<h2>
GIS Portal
</h2>

</div>

<div class="toolbar-right">

<div class="basemap-container">


<button class="tool-button" id="basemap-button">

Basemap

</button>



<div id="basemap-menu">


<button class="basemap-option" data-map="osm">

OpenStreetMap

</button>



<button class="basemap-option" data-map="satellite">

Satellite

</button>



<button class="basemap-option" data-map="terrain">

Terrain

</button>


</div>


</div>


</div>


</div>


</header>






<!-- ========================= -->
<!-- Main Layout -->
<!-- ========================= -->


<main id="main-container">



<!-- Legend -->
<button id="legend-toggle">☰ Legend</button>

<aside id="legend-panel">


<div class="panel-title">

Legend

</div>



<div class="legend-content">

<div class="legend-item" id="legend-districts">

<span class="legend-symbol polygon"></span>

<span>
Boundary
</span>

</div>


<div class="legend-item" id="legend-roads">

<span class="legend-symbol line"></span>

<span>
Roads
</span>

</div>


<div class="legend-item" id="legend-raster">

<span class="legend-symbol raster"></span>

<span>
پلان موقعیت
</span>

</div>


</aside>



<div id="search-panel">

    <input 
    type="text" 
    id="search-input"
    placeholder="Search District...">


    <button id="search-go">
        🔍
    </button>


</div>


<!-- Map -->

<section id="map"></section>




<!-- Coordinates -->


<div id="coordinate-display">

Lat: 0.000000 | Lon: 0.000000

</div>







<!-- Layer Panel -->

<button id="layer-toggle">☰ Layers</button>
<aside id="layer-panel">


<div class="panel-title">

Layers

</div>



<div id="layer-list">


</div>


</aside>




</main>






<!-- Status Bar -->

<footer id="status-bar">


</footer>






<!-- JavaScript -->


<script src="lib/leaflet/leaflet.js"></script>


<script src="js/config.js"></script>

<script src="js/layers.js"></script>

<script src="js/layerControl.js"></script>

<script src="js/toolbar.js"></script>

<script src="js/legend.js"></script>

<script src="js/basemap.js"></script>

<script src="js/search.js"></script>

<script src="js/measure.js"></script>
<script src="js/rasterLayers.js"></script>
<script src="js/print.js"></script>

<script src="js/identify.js"></script>
<script src="js/script.js"></script>



</body>

</html>
